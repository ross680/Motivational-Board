<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02070b" />
  <title>3R Motivational TV</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage" aria-label="3R motivational slideshow">
    <img id="slide" alt="3R motivational poster" />
    <div id="fade"></div>
    <div id="progress"><span></span></div>
    <div id="counter" aria-live="polite"></div>
    <div id="controls">
      <button id="prev" aria-label="Previous slide">◀</button>
      <button id="pause" aria-label="Pause slideshow">Ⅱ</button>
      <button id="next" aria-label="Next slide">▶</button>
      <button id="full" aria-label="Fullscreen">⛶</button>
    </div>
  </main>
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
